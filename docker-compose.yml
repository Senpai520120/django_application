name: users-and-roles

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: users_roles
      POSTGRES_USER: users_roles
      POSTGRES_PASSWORD: users_roles
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users_roles"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    env_file:
      - .env
    # Перекрывает .env
    environment:
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://users_roles:users_roles@db:5432/users_roles
      # Тестовые аккаунты demo_* при старте. В бою убрать или "0".
      SEED_DEMO_USERS: "1"
      # Файловый менеджер. Для s3-режима: FILE_STORAGE_BACKEND=s3 в .env,
      # плюс бакет и ключи (или профиль s3 с localstack ниже).
      FILE_STORAGE_BACKEND: ${FILE_STORAGE_BACKEND:-local}
      FILE_MANAGER_ROOT: /app/filemanager
      FILE_MANAGER_MAX_FILE_SIZE: "5242880"
    ports:
      - "8000:8000"
    volumes:
      - filestore:/app/filemanager
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/login/')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  # Локальный S3 для проверки s3-режима без облака: docker compose --profile s3 up
  localstack:
    image: localstack/localstack:3
    profiles: ["s3"]
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: eu-central-1
    ports:
      - "4566:4566"

volumes:
  pgdata:
  filestore:
