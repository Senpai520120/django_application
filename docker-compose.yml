name: users-and-roles

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: users_roles
      POSTGRES_USER: users_roles
      POSTGRES_PASSWORD: users_roles
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users_roles"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    # SECRET_KEY берётся из .env (см. .env.example).
    env_file:
      - .env
    # Эти значения перекрывают то, что лежит в .env.
    environment:
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://users_roles:users_roles@db:5432/users_roles
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_groups &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
