name: users-and-roles

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: users_roles
      POSTGRES_USER: users_roles
      POSTGRES_PASSWORD: users_roles
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users_roles"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    env_file:
      - .env
    # Перекрывает .env
    environment:
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://users_roles:users_roles@db:5432/users_roles
      # Тестовые аккаунты demo_* при старте. В бою убрать или "0".
      SEED_DEMO_USERS: "1"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/login/')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
