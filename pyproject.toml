[project]
name = "users-and-roles"
version = "0.1.0"
description = "Django-приложение: пользователи, роли и кастомная админка на /manage/"
requires-python = ">=3.11"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [".venv", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "DJ"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "config", "panel"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q"
# whitenoise ворчит про отсутствующий STATIC_ROOT: в тестах collectstatic не нужен.
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.coverage.run]
source = ["accounts", "config", "panel"]
omit = ["*/migrations/*", "config/asgi.py", "config/wsgi.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
